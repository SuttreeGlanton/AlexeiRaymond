name: Publish The Iron Crown

on:
  schedule:
    # GitHub cron uses UTC. 22:15 UTC on 9 August is
    # 00:15 CEST in Turin on 10 August 2026.
    - cron: '15 22 9 8 *'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - name: Sync main
        run: git pull --ff-only origin main

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Promote The Iron Crown
        id: promote
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';

          const outputPath = process.env.GITHUB_OUTPUT;
          const releaseAt = new Date('2026-08-09T22:00:00Z');
          const now = new Date();

          function setChanged(value) {
            fs.appendFileSync(outputPath, `changed=${value ? 'true' : 'false'}\n`);
          }

          if (now.getUTCFullYear() !== 2026 || now < releaseAt) {
            console.log('The Iron Crown release time has not arrived.');
            setChanged(false);
            process.exit(0);
          }

          const dataPath = 'site-data.json';
          const data = JSON.parse(fs.readFileSync(dataPath, 'utf8'));
          const piece = data.pieces.find((candidate) => candidate.title === 'The Iron Crown');

          if (!piece) {
            throw new Error('Could not find "The Iron Crown" in site-data.json.');
          }

          const releaseDate = '10/08/2026';
          const releaseLink = 'https://somewords.boards.net/thread/91/alexei-raymond';
          const currentTags = Array.isArray(piece.tags) ? piece.tags : [];
          const nextTags = currentTags.filter((tag) => tag !== 'Upcoming');

          if (!nextTags.includes('Online')) {
            nextTags.unshift('Online');
          }

          const alreadyPublished =
            piece.date === releaseDate &&
            piece.link === releaseLink &&
            !currentTags.includes('Upcoming');

          if (alreadyPublished) {
            console.log('The Iron Crown is already published in site-data.json.');
            setChanged(false);
            process.exit(0);
          }

          piece.date = releaseDate;
          piece.link = releaseLink;
          piece.tags = nextTags;
          delete piece.scheduledRelease;

          fs.writeFileSync(dataPath, `${JSON.stringify(data, null, 2)}\n`);
          console.log('Promoted The Iron Crown from Upcoming to published.');
          setChanged(true);
          NODE

      - name: Install dependencies
        if: steps.promote.outputs.changed == 'true'
        run: npm ci --no-audit --no-fund

      - name: Build site
        if: steps.promote.outputs.changed == 'true'
        run: npm run build

      - name: Quality gates
        if: steps.promote.outputs.changed == 'true'
        run: |
          npm run check
          npm run check:assets
          npm run check:metadata
          npm run check:links:local
          npm run audit:privacy

      - name: Commit publication update
        if: steps.promote.outputs.changed == 'true'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site-data.json
          git commit -m "Publish The Iron Crown"
          git push origin HEAD:main

      - name: Upload Pages artifact
        if: steps.promote.outputs.changed == 'true'
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

      - name: Deploy to GitHub Pages
        if: steps.promote.outputs.changed == 'true'
        id: deployment
        uses: actions/deploy-pages@v5
