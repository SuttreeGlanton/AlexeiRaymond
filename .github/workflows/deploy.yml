name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: ">=22.23.4 <23"
          check-latest: true
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Cache optimized images
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .astro-cache/assets
          # Source changes can introduce new image sizes even when the artwork is unchanged.
          key: astro-images-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('package-lock.json', 'astro.config.mjs') }}-${{ hashFiles('src/**', 'site-data.json') }}
          restore-keys: |
            astro-images-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('package-lock.json', 'astro.config.mjs') }}-

      - name: Build site
        run: npm run build
      - name: Quality gates
        run: |
          npm run check
          npm run check:assets
          npm run check:metadata
          npm run check:links:local
          npm run audit:privacy

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
